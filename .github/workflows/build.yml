# INTERNAL — triggered on push to main, via merge-gate (workflow_call), and manually; never on pull_request directly.
name: Gradle Compile & UT

on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

jobs:
  run-build-and-deploy:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-build.yml@v2.7.1
    with:
      flow-type: hybrid
      # detekt 1.23.x (Kotlin 2.0.21) cannot run on JDK 24+, and `./gradlew build` runs detekt,
      # so compile+UT run on JDK 21 (LTS). Bytecode target stays 17 (see build.gradle.kts).
      java-version: '21'
