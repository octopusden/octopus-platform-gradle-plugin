# INTERNAL — triggered on push to main, via merge-gate (workflow_call), and manually; never on pull_request directly.
name: Quality

on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-quality-gates.yml@v3.0.0
    with:
      # detekt 1.23.x (Kotlin 2.0.21) cannot run on JDK 24+, so static analysis runs on JDK 21 (LTS).
      # Bytecode target stays 17 (see build.gradle.kts).
      java-version: '21'
    secrets: inherit
