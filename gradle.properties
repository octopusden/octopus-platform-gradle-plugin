version=1.0-SNAPSHOT
group=org.octopusden.octopus.platform

kotlin.version=2.2.0
# Kotlin Gradle plugin, deliberately separate from the runtime `kotlin.version` above: Gradle 9.8 needs
# a newer plugin than that runtime, and bumping the plugin must not change the Kotlin stdlib that the
# published plugin depends on. 2.3.x is the lowest line whose compiler reads the Kotlin metadata (2.4)
# of Gradle 9.8's own API, which the plugin compiles against.
kotlin-plugin.version=2.3.10
nexus-plugin.version=2.0.0
com-jfrog-artifactory.version=6.0.4

# Quality gates (octopusden convention) — tool versions pinned to match octopus-base
octopus-quality.version=3.0.0
sonarqube.version=7.5.0.8588
detekt.version=2.0.0-alpha.5
ktlint-gradle.version=14.0.1

octopus-build-integration.version=2.0.5
octopus-publishing.version=2.0.1
octopus-license-management.version=2.1.20
sonarqube.version=7.3.1.8318

# Pinned to align transitive deps pulled in by octopus-license-management
# (whose published POMs reference jackson without explicit versions)
jackson-bom.version=2.21.4

platformlib-process.version=0.1.4
junit-jupiter.version=5.10.2
assertj.version=3.25.3
slf4j.version=2.0.13
logback.version=1.5.18
